name: Deploy Grubify API

on:
  push:
    branches: [main]
    paths:
      - GrubifyApi/**
      - .github/workflows/deploy-grubify-api.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: grubify-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build immutable image
        run: |
          az acr build \
            --registry "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}" \
            --image "grubify-api:${GITHUB_SHA}" \
            --file GrubifyApi/Dockerfile \
            GrubifyApi

      - name: Deploy image
        run: |
          LOGIN_SERVER=$(az acr show \
            --name "${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}" \
            --query loginServer -o tsv)
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.GRUBIFY_API_CONTAINER_APP }}" \
            --image "${LOGIN_SERVER}/grubify-api:${GITHUB_SHA}" \
            --output none

      - name: Verify health
        run: |
          FQDN=$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.GRUBIFY_API_CONTAINER_APP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in {1..18}; do
            if curl --fail --silent --show-error "https://${FQDN}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Health verification failed after 180 seconds" >&2
          exit 1
